
{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h1>Clientes</h1>
    <div>
        <a href="/clientes/inactivos" class="btn btn-outline-secondary">Ver desactivados</a>
        <a href="/clientes/nuevo" class="btn btn-primary">+ Nuevo cliente</a>
    </div>
</div>
<table class="table table-striped bg-white">
    <thead><tr><th>ID</th><th>Nombre</th><th>Apellido</th><th>Número</th><th>Registro</th><th></th></tr></thead>
    <tbody>
    {% for c in clientes %}
        <tr>
            <td>{{ c.id_cliente }}</td>
            <td>{{ c.nombre }}</td>
            <td>{{ c.apellido }}</td>
            <td>{{ c.numero }}</td>
            <td>{{ c.fecha_registro }}</td>
            <td>
                <form method="POST" action="/clientes/desactivar/{{ c.id_cliente }}" onsubmit="return confirm('¿Desactivar a {{ c.nombre }} {{ c.apellido }}? Ya no aparecerá en la lista principal, pero su historial de ventas se conserva.');">
                    <button type="submit" class="btn btn-sm btn-outline-danger">Desactivar</button>
                </form>
            </td>
        </tr>
    {% endfor %}
    </tbody>
</table>
{% endblock %}
