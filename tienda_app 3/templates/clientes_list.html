{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h1>Clientes</h1>
    <a href="/clientes/nuevo" class="btn btn-primary">+ Nuevo cliente</a>
</div>
<table class="table table-striped bg-white">
    <thead><tr><th>ID</th><th>Nombre</th><th>Apellido</th><th>Número</th><th>Registro</th></tr></thead>
    <tbody>
    {% for c in clientes %}
        <tr>
            <td>{{ c.id_cliente }}</td>
            <td>{{ c.nombre }}</td>
            <td>{{ c.apellido }}</td>
            <td>{{ c.numero }}</td>
            <td>{{ c.fecha_registro }}</td>
        </tr>
    {% endfor %}
    </tbody>
</table>
{% endblock %}
