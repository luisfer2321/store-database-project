{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h1>Vendedores</h1>
    <a href="/vendedores/nuevo" class="btn btn-primary">+ Nuevo vendedor</a>
</div>
<table class="table table-striped bg-white">
    <thead><tr><th>ID</th><th>Nombre</th><th>Apellido</th><th>Número</th><th>Contratación</th></tr></thead>
    <tbody>
    {% for v in vendedores %}
        <tr>
            <td>{{ v.id_vendedor }}</td>
            <td>{{ v.nombre }}</td>
            <td>{{ v.apellido }}</td>
            <td>{{ v.numero }}</td>
            <td>{{ v.fecha_contratacion }}</td>
        </tr>
    {% endfor %}
    </tbody>
</table>
{% endblock %}
