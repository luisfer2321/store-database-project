{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h1>Clientes desactivados</h1>
    <a href="/clientes" class="btn btn-outline-secondary">Volver a clientes activos</a>
</div>
<table class="table table-striped bg-white">
    <thead><tr><th>ID</th><th>Nombre</th><th>Apellido</th><th>Número</th><th></th></tr></thead>
    <tbody>
    {% for c in clientes %}
        <tr>
            <td>{{ c.id_cliente }}</td>
            <td>{{ c.nombre }}</td>
            <td>{{ c.apellido }}</td>
            <td>{{ c.numero }}</td>
            <td>
                <form method="POST" action="/clientes/reactivar/{{ c.id_cliente }}">
                    <button type="submit" class="btn btn-sm btn-success">Reactivar</button>
                </form>
            </td>
        </tr>
    {% endfor %}
    </tbody>
</table>
{% endblock %}
