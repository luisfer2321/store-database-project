{% extends "base.html" %}
{% block content %}
<h1>Nuevo producto</h1>
<form method="POST" class="bg-white p-4 rounded" style="max-width:500px;">
    <div class="mb-3">
        <label class="form-label">Nombre</label>
        <input name="nombre" class="form-control" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Categoría</label>
        <select name="id_categoria" class="form-select" required>
            {% for c in categorias %}
                <option value="{{ c.id_categoria }}">{{ c.nombre }}</option>
            {% endfor %}
        </select>
        <a href="/categorias/nueva" class="small">+ agregar nueva categoría</a>
    </div>
    <div class="mb-3">
        <label class="form-label">Proveedor</label>
        <select name="id_proveedor" class="form-select" required>
            {% for p in proveedores %}
                <option value="{{ p.id_proveedor }}">{{ p.nombre_empresa }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="mb-3">
        <label class="form-label">Precio unitario</label>
        <input type="number" step="0.01" name="precio_unitario" class="form-control" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Talla</label>
        <input name="talla" class="form-control">
    </div>
    <div class="mb-3">
        <label class="form-label">Color</label>
        <input name="color" class="form-control">
    </div>
    <div class="mb-3">
        <label class="form-label">Stock inicial</label>
        <input type="number" name="stock_actual" class="form-control" value="0">
    </div>
    <button class="btn btn-primary">Guardar</button>
</form>
{% endblock %}
